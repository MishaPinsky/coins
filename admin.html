<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>Админка</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<style>
:root{--bg:#faf8f3;--card:#fff;--tx:#2a2620;--mut:#7a7366;--ac:#9a6b1f;--bd:#e5dfd0}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#1c1a16;--card:#27241e;--tx:#efe9dc;--mut:#a39b8a;--ac:#d9a441;--bd:#3a362d}}
body{margin:0 auto;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,sans-serif;padding:16px;max-width:720px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:14px}
.card img{width:100%;max-height:240px;object-fit:cover;border-radius:10px}
.mut{color:var(--mut);font-size:14px}.offer{border-top:1px solid var(--bd);padding:8px 0;font-size:14px}
input,textarea,button{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);width:100%;box-sizing:border-box;margin-top:8px}
button{background:var(--ac);color:#fff;border:0;cursor:pointer;font-weight:600}
button.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.hide{display:none}
</style></head><body>
<h1>Админка</h1>
<div id="login" class="card hide">
  <input id="em" type="email" placeholder="Email" autocomplete="username">
  <input id="pw" type="password" placeholder="Пароль" autocomplete="current-password">
  <button id="go">Войти</button><div id="lm" class="mut"></div>
</div>
<div id="app" class="hide">
  <div class="card"><b>Добавить монету</b>
    <input id="n" placeholder="Название">
    <textarea id="d" rows="2" placeholder="Описание (год, состояние…)"></textarea>
    <input id="f" type="file" accept="image/*">
    <button id="add">Добавить</button><div id="am" class="mut"></div></div>
  <div id="list"></div>
  <button class="sec" id="out">Выйти</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// === ТЕ ЖЕ ДАННЫЕ, ЧТО В index.html ===
const SUPABASE_URL = 'https://XXXX.supabase.co';
const SUPABASE_ANON_KEY = 'ВСТАВЬ_ANON_PUBLIC_KEY';
// =====================================
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function load() {
  const [{ data: coins }, { data: offers }] = await Promise.all([
    sb.from('coins').select('*').order('created_at', { ascending: false }),
    sb.from('offers').select('*').order('amount', { ascending: false })]);
  $('list').innerHTML = (coins || []).map(c => {
    const os = (offers || []).filter(o => o.coin_id === c.id);
    return `<div class="card">${c.image_url ? `<img src="${esc(c.image_url)}" alt="">` : ''}
      <h3>${esc(c.name)}</h3><div class="mut">${esc(c.description)}</div>
      <b>Предложения (${os.length})</b>
      ${os.map(o => `<div class="offer"><b>${esc(o.amount)}</b> — ${esc(o.name)}, ${esc(o.contact)}
        <span class="mut">(${new Date(o.created_at).toLocaleString('ru')})</span></div>`).join('')}
      <button class="sec" data-del="${esc(c.id)}" data-img="${esc(c.image_url)}">Удалить монету</button></div>`;
  }).join('') || '<p class="mut">Монет пока нет.</p>';
}
async function show(session) {
  $('login').classList.toggle('hide', !!session);
  $('app').classList.toggle('hide', !session);
  if (session) load();
}
sb.auth.getSession().then(({ data }) => show(data.session));
$('go').onclick = async () => {
  const { error } = await sb.auth.signInWithPassword({ email: $('em').value.trim(), password: $('pw').value });
  if (error) $('lm').textContent = 'error.message'; else sb.auth.getSession().then(({ data }) => show(data.session));
};
$('out').onclick = async () => { await sb.auth.signOut(); show(null); };
$('add').onclick = async () => {
  const name = $('n').value.trim(); if (!name) { $('am').textContent = 'Введите название'; return; }
  $('am').textContent = 'Загрузка…';
  let image_url = null; const f = $('f').files[0];
  if (f) {
    const path = Date.now() + '-' + f.name.replace(/[^\w.\-]/g, '_');
    const { error } = await sb.storage.from('coins').upload(path, f);
    if (error) { $('am').textContent = 'Ошибка загрузки фото: ' + error.message; return; }
    image_url = sb.storage.from('coins').getPublicUrl(path).data.publicUrl;
  }
  const { error } = await sb.from('coins').insert({ name, description: $('d').value.trim(), image_url });
  if (error) { $('am').textContent = 'Ошибка: ' + error.message; return; }
  $('n').value = ''; $('d').value = ''; $('f').value = ''; $('am').textContent = 'Добавлено ✓'; load();
};
$('list').onclick = async e => {
  const b = e.target.closest('[data-del]'); if (!b || !confirm('Удалить монету и её предложения?')) return;
  await sb.from('coins').delete().eq('id', b.dataset.del);
  const key = b.dataset.img.split('/coins/')[1];
  if (key) await sb.storage.from('coins').remove([decodeURIComponent(key)]);
  load();
};
</script></body></html>
