<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>Монеты</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#faf8f3;--card:#fff;--tx:#2a2620;--mut:#7a7366;--ac:#9a6b1f;--bd:#e5dfd0}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#1c1a16;--card:#27241e;--tx:#efe9dc;--mut:#a39b8a;--ac:#d9a441;--bd:#3a362d}}
body{margin:0 auto;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,sans-serif;padding:16px;max-width:720px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:14px}
.card img{width:100%;height:auto;max-height:80vh;object-fit:contain;border-radius:10px;background:var(--bg)}
h2{font-size:18px;margin:10px 0 2px}.mut{color:var(--mut);font-size:14px}
input,button{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);width:100%;box-sizing:border-box;margin-top:8px}
button{background:var(--ac);color:#fff;border:0;cursor:pointer;font-weight:600}
button.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.hide{display:none}.hp{position:absolute;left:-9999px}
</style></head><body>
<h1>🪙 Монеты</h1>
<div id="list"><p class="mut">Загрузка…</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// === ВСТАВЬ СВОИ ДАННЫЕ (Supabase → Project Settings → API) ===
const SUPABASE_URL = 'https://nrhzteubsatvfvejjqfz.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_ZHtBjrT3SWK9qwPEJL5hlw_vG-51m8p';
// ===============================================================
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

(async () => {
  const { data, error } = await sb.from('coins').select('*').order('created_at', { ascending: false });
  if (error) { $('list').innerHTML = '<p class="mut">Не удалось загрузить монеты.</p>'; return; }
  if (!data.length) { $('list').innerHTML = '<p class="mut">Монет пока нет.</p>'; return; }
  $('list').innerHTML = data.map(c => `<div class="card">
    ${c.image_url ? `<img src="${esc(c.image_url)}" alt="">` : ''}
    <h2>${esc(c.name)}</h2><div class="mut">${esc(c.description)}</div>
    <button class="sec" data-offer="${esc(c.id)}">Предложить цену</button>
    <div class="hide" data-form="${esc(c.id)}">
      <input data-f="amount" type="number" min="0" step="any" placeholder="Ваша цена">
      <input data-f="name" maxlength="100" placeholder="Ваше имя">
      <input data-f="contact" maxlength="200" placeholder="Контакт (почта или Telegram)">
      <input class="hp" data-f="site" tabindex="-1" autocomplete="off">
      <button data-send="${esc(c.id)}">Отправить</button>
      <div class="mut" data-msg="${esc(c.id)}"></div>
    </div></div>`).join('');
})();

$('list').onclick = async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.offer) document.querySelector(`[data-form="${b.dataset.offer}"]`).classList.toggle('hide');
  if (b.dataset.send) {
    const id = b.dataset.send;
    const form = document.querySelector(`[data-form="${id}"]`), msg = document.querySelector(`[data-msg="${id}"]`);
    const v = k => form.querySelector(`[data-f="${k}"]`).value.trim();
    if (v('site')) return; // ловушка для ботов
    const amount = parseFloat(v('amount'));
    if (!(amount > 0) || v('contact').length < 3) { msg.textContent = 'Укажите цену и контакт'; return; }
    b.disabled = true;
    const { error } = await sb.from('offers').insert({ coin_id: id, amount, name: v('name'), contact: v('contact') });
    b.disabled = false;
    if (error) { msg.textContent = 'Не удалось отправить, попробуйте позже.'; return; }
    msg.textContent = 'Предложение отправлено ✓';
    form.querySelectorAll('input').forEach(i => i.value = '');
  }
};
</script></body></html>
